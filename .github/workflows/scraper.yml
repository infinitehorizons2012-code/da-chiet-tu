name: Scrape Hanzicraft

on:
  schedule:
    # Chạy mỗi 2 tiếng một lần để không bị khóa IP
    - cron: "0 */2 * * *"
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium

      - name: Run Scraper
        run: python scrape_hanzicraft.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hanzicraft_dashboard_reordered.xlsx
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scrape Breakdown & Components batch" && git pull --rebase && git push)
