name: Scrape XieHanzi

on:
  schedule:
    # Chạy mỗi 2 tiếng một lần, so le với Hanzicraft (phút 30)
    - cron: "30 */2 * * *"
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Scraper
        run: python scrape_xiehanzi.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hanzicraft_dashboard_reordered.xlsx
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scrape XieHanzi batch" && git push)
