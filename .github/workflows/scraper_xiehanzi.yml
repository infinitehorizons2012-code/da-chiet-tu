name: Scrape XieHanzi

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      chars:
        description: 'Danh sách chữ cần cào (cách nhau bởi khoảng trắng - để trống nếu muốn cào TẤT CẢ chữ còn thiếu)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Rich XieHanzi Scraper
        run: python scrape_xiehanzi_rich.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "Auto-scrape XieHanzi batch (Partial/Complete)"
          file_pattern: "hanzicraft_dashboard_reordered.xlsx"
