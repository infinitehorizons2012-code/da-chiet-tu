name: Scrape XieHanzi

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:
    inputs:
      chars:
        description: 'Danh sách chữ cần cào (cách nhau bởi khoảng trắng)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Scraper
        run: python scrape_xiehanzi.py --chars "${{ github.event.inputs.chars }}"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-scrape XieHanzi batch"
          file_pattern: "hanzicraft_dashboard_reordered.xlsx"
