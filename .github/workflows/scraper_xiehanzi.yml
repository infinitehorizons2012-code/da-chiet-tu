name: Scrape XieHanzi

on:
  schedule:
    # Chạy mỗi 2 tiếng một lần, so le với Hanzicraft (phút 30)
    - cron: "30 */2 * * *"
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Scraper
        run: python scrape_xiehanzi.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-scrape XieHanzi batch"
          file_pattern: "hanzicraft_dashboard_reordered.xlsx"
